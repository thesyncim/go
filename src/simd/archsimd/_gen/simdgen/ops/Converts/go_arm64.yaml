# Float -> Int conversions (same-size)
# ISA XML has float→float for FCVTZS_int; use OverwriteBase to correct output type
# float32 -> int32
- go: ConvertToInt32
  asm: "VFCVTZS"
  in:
    - base: float
      elemBits: 32
  out:
    - base: float
      elemBits: 32
      overwriteBase: int

# float32 -> uint32
- go: ConvertToUint32
  asm: "VFCVTZU"
  in:
    - base: float
      elemBits: 32
  out:
    - base: float
      elemBits: 32
      overwriteBase: uint

# float64 -> int64
- go: ConvertToInt64
  asm: "VFCVTZS"
  in:
    - base: float
      elemBits: 64
  out:
    - base: float
      elemBits: 64
      overwriteBase: int

# float64 -> uint64
- go: ConvertToUint64
  asm: "VFCVTZU"
  in:
    - base: float
      elemBits: 64
  out:
    - base: float
      elemBits: 64
      overwriteBase: uint

# Int -> Float conversions (same-size)
# ISA XML has float→float for SCVTF_int/UCVTF_int; use OverwriteBase to correct input type
# int32 -> float32
- go: ConvertToFloat32
  asm: "VSCVTF"
  in:
    - base: float
      elemBits: 32
      overwriteBase: int
  out:
    - base: float
      elemBits: 32

# uint32 -> float32
- go: ConvertToFloat32
  asm: "VUCVTF"
  in:
    - base: float
      elemBits: 32
      overwriteBase: uint
  out:
    - base: float
      elemBits: 32

# int64 -> float64
- go: ConvertToFloat64
  asm: "VSCVTF"
  in:
    - base: float
      elemBits: 64
      overwriteBase: int
  out:
    - base: float
      elemBits: 64

# uint64 -> float64
- go: ConvertToFloat64
  asm: "VUCVTF"
  in:
    - base: float
      elemBits: 64
      overwriteBase: uint
  out:
    - base: float
      elemBits: 64

# Float narrow/widen
# float64 -> float32 narrow
- go: ConvertToFloat32
  asm: "VFCVTN"
  hiHalfAsm: "VFCVTN2"
  in:
    - base: float
      elemBits: 64
  out:
    - base: float
      elemBits: 32
      bits: 128

# float32 -> float64 widen
- go: ConvertToFloat64
  asm: "VFCVTL"
  hiHalfAsm: "VFCVTL2"
  in:
    - base: float
      elemBits: 32
  out:
    - base: float
      elemBits: 64
      bits: 128

# TODO: ExtendTo, TruncTo and SaturateTo are only provided for a 2:1 element
# size ratio here, which is what NEON does in one instruction, but the spec
# defines every ratio. Add the 4:1 and 8:1 forms as sequences of 2:1
# instructions, and perhaps peephole chains of 2:1 conversions into those
# sequences.

# Integer extend (widen) — signed
# x.ExtendTo*().ShiftAllLeft(c) fuses into VSSHLL (or VUSHLL for unsigned
# extends) for shifts smaller than the source element width.
# int8 -> int16
- go: ExtendToInt16
  asm: "VSXTL"
  hiHalfAsm: "VSXTL2"
  peepholeRules:
  - !string "(VSHL%w [c] (%h x)) && uint64(c) < %b => (VSSHLL%a [c] x)"
  - !string "(VSHL%w [c] (VSXTL2_%a x)) && uint64(c) < %b => (VSSHLL2_%a [c] x)"
  in:
    - base: int
      elemBits: 8
  out:
    - base: int
      elemBits: 16
      bits: 128

