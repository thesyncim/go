  - !string "(%h (VSSHR%a [c] x)) && uint64(c) >= 1 && uint64(c)*2 <= %b => (VSHRN%a [c] x)"
  - !string "(%h (VURSHR%a [c] x)) && uint64(c) >= 1 && uint64(c)*2 <= %b => (VRSHRN%a [c] x)"
  - !string "(%h (VSRSHR%a [c] x)) && uint64(c) >= 1 && uint64(c)*2 <= %b => (VRSHRN%a [c] x)"
