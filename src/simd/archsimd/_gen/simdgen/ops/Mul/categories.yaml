!sum
- go: Mul
  commutative: true
  documentation: !string |-
    // NAME multiplies corresponding elements of two vectors, modulo 2ⁿ.
- go: MulWidenEven
  commutative: true
  documentation: !string |-
    // NAME multiplies even-indexed elements, widening the result.
    // Result[i] = v1[2*i] * v2[2*i].
- go: MulHigh
  commutative: true
  documentation: !string |-
    // NAME multiplies elements and stores the high part of the result.
- go: MulFixedPointRounded
  commutative: true
  documentation: !string |-
    // NAME multiplies signed fixed-point elements, rounding and saturating the result.
# The accumulating form of MulWiden, as a machine op only, for a peephole
# rule that fuses x.Add(y.MulWiden(z)).
- go: mulWidenAccumulate
  noTypes: "true"
  noGenericOps: "true"
  commutative: false
  documentation: !string |-
    // NAME adds the widened products of corresponding low-indexed elements of y and z to x.
- go: MulWiden
  commutative: true
  documentation: !string |-
    // NAME multiplies corresponding low-indexed elements and produces a result with double the element width.
