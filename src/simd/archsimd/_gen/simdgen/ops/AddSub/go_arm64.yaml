!sum
- go: Add
  asm: "VADD|VFADD"
  in:
  - &any
    go: $t
  - *any
  out:
  - *any
- go: Sub
  asm: "VSUB|VFSUB"
  in:
  - *any
  - *any
  out:
  - *any

# Signed saturating add — VSQADD
- go: AddSaturated
  signed: true
  asm: "VSQADD"
  in:
  - &int
    go: $t
    base: int
  - *int
  out:
  - *int

# Unsigned saturating add — VUQADD
- go: AddSaturated
  signed: false
  asm: "VUQADD"
  in:
  - &uint
    go: $t
    base: uint
  - *uint
  out:
  - *uint

# Signed saturating subtract — VSQSUB
- go: SubSaturated
  signed: true
  asm: "VSQSUB"
  in:
  - *int
  - *int
  out:
  - *int

# Unsigned saturating subtract — VUQSUB
- go: SubSaturated
  signed: false
  asm: "VUQSUB"
  in:
  - *uint
  - *uint
  out:
  - *uint

# Horizontal add of pairs (concatenated) — VADDP (int)
- go: ConcatAddPairs
  signed: true
  asm: "VADDP"
  in:
  - *int
  - *int
  out:
  - *int

# Horizontal add of pairs (concatenated) — VADDP (uint)
- go: ConcatAddPairs
  signed: false
  asm: "VADDP"
  in:
  - *uint
  - *uint
  out:
  - *uint

# Horizontal add of pairs (concatenated) — VFADDP (float)
- go: ConcatAddPairs
  asm: "VFADDP"
  in:
  - &fp
    go: $t
    base: float
  - *fp
  out:
  - *fp

# Add pairwise long — VUADDLP, VSADDLP
# x.Add(y.AddPairsWiden()) fuses into VUADALP or VSADALP.
- go: AddPairsWiden
  asm: "VUADDLP"
  peepholeRules:
  - !string "(VADD%w x d:(%h y)) && d.Uses == 1 => (VUADALP%a x y)"
  in:
  - go: $t
    base: uint
    bits: 128
  out:
  - go: $u
    base: uint

- go: AddPairsWiden
  asm: "VSADDLP"
  peepholeRules:
  - !string "(VADD%w x d:(%h y)) && d.Uses == 1 => (VSADALP%a x y)"
  in:
  - go: $t
    base: int
    bits: 128
  out:
  - go: $u
    base: int

# Add and accumulate pairwise long — VUADALP, VSADALP
- go: addPairsWidenAccumulate
  asm: "VUADALP"
  in:
  - &uadalpAcc
    go: $u
    base: uint
  - go: $t
    base: uint
    bits: 128
  out:
  - *uadalpAcc

- go: addPairsWidenAccumulate
  asm: "VSADALP"
  in:
  - &sadalpAcc
    go: $u
    base: int
  - go: $t
    base: int
    bits: 128
  out:
  - *sadalpAcc
